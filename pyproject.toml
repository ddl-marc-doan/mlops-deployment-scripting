[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-pat-manager"
version = "0.1.0"
description = "Manage per-repo GitLab Project Access Tokens for read-only clone access (e.g. Domino service account git credentials)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
gitlab-pat-manager = "gitlab_pat_manager.cli:main"

[tool.setuptools.packages.find]
include = ["gitlab_pat_manager*"]
